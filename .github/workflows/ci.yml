name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Regression suite (motor.js, engine, backend auth/persistence)
        run: npm test

      - name: Runtime validation (all organization packages, full-day scenario)
        run: node lib/regression/cross-organization.mjs

      - name: Adapter dry run (all registered adapters)
        run: node lib/adapters/dry-run.mjs

      - name: Adapter performance (100/500/1000 export packages)
        run: node lib/regression/adapter-performance.mjs
