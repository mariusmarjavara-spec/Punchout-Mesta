<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Punchout brand mark: a structured grid, punched through by a checkmark.
       Grid = structure/system, check = verified/complete, shards = output/distribution.
       Graphite #1F2933 grid on light backgrounds, white grid on dark, orange #FF6A00 checkmark always. -->
  <style>
    .grid-line { stroke: #1F2933; }
    .shard { fill: #1F2933; }
    @media (prefers-color-scheme: dark) {
      .grid-line { stroke: #FFFFFF; }
      .shard { fill: #FFFFFF; }
    }
  </style>
  <g class="grid-line" stroke-width="5" fill="none">
    <rect x="20" y="20" width="100" height="100" rx="6" stroke-width="6" />
    <line x1="45" y1="20" x2="45" y2="120" />
    <line x1="70" y1="20" x2="70" y2="120" />
    <line x1="95" y1="20" x2="95" y2="120" />
    <line x1="20" y1="45" x2="120" y2="45" />
    <line x1="20" y1="70" x2="120" y2="70" />
    <line x1="20" y1="95" x2="120" y2="95" />
  </g>
  <!-- Shatter shards, breaking out toward the upper right, tucked against the checkmark's exit point -->
  <g class="shard">
    <polygon points="126,50 152,40 137,62" />
    <polygon points="140,68 162,64 148,84" />
    <polygon points="122,30 142,18 130,42" />
  </g>
  <!-- Checkmark punching through the grid -->
  <path d="M38 92 L72 124 L152 32"
        stroke="#FF6A00" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
